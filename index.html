<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Terra Mágica - Simulador Medieval</title>
    <!-- Motor Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        .ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #f1c40f;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #b45309;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 16px;
            pointer-events: none;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .ui-left strong {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <div class="ui-left">
            🏰 <strong>Terra Mágica</strong>
        </div>
        <div class="ui-right">
            🪵 Madera: <span id="wood-count" style="color:#22c55e;">100</span> | 🪙 Oro: <span id="gold-count" style="color:#eab308;">50</span>
        </div>
    </div>

    <div id="game-container"></div>

    <script>
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            parent: 'game-container',
            pixelArt: true,
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        let wood = 100;
        let gold = 50;

        const game = new Phaser.Game(config);

        function preload() {
            // Generador interno de textura de Castillo Medieval Profesional (Sin depender de internet)
            const g = this.make.graphics({ x: 0, y: 0, add: false });

            // Sombra base del castillo
            g.fillStyle(0x1e293b, 0.6);
            g.fillRect(15, 120, 170, 20);

            // Torres laterales de piedra texturizada
            g.fillStyle(0x64748b);
            g.fillRect(20, 40, 35, 80);
            g.fillRect(145, 40, 35, 80);

            // Muros centrales
            g.fillStyle(0x475569);
            g.fillRect(50, 60, 95, 60);

            // Puerta principal de madera reforzada
            g.fillStyle(0x38220f);
            g.fillRect(82, 80, 32, 40);
            g.lineStyle(2, 0x1f1307);
            g.strokeRect(82, 80, 32, 40);

            // Ventanas de arcos de piedra (almenas)
            g.fillStyle(0x1e293b);
            g.fillRect(30, 50, 15, 20);
            g.fillRect(155, 50, 15, 20);
            g.fillRect(88, 45, 18, 20);

            // Techos cónicos de los torreones (rojo medieval)
            g.fillStyle(0x991b1b);
            // Torre izquierda
            g.beginPath();
            g.moveTo(15, 40);
            g.lineTo(37, 10);
            g.lineTo(60, 40);
            g.closePath();
            g.fillPath();

            // Torre derecha
            g.beginPath();
            g.moveTo(140, 40);
            g.lineTo(162, 10);
            g.lineTo(185, 40);
            g.closePath();
            g.fillPath();

            // Techo central principal
            g.fillStyle(0xb91c1c);
            g.beginPath();
            g.moveTo(45, 60);
            g.lineTo(97, 25);
            g.lineTo(150, 60);
            g.closePath();
            g.fillPath();

            // Guardamos la textura generada con el nombre 'castillo_pro'
            g.generateTexture('castillo_pro', 200, 140);

            // Cargamos solo los árboles laterales que sí funcionan bien
            this.load.image('arbol', 'https://cdn.jsdelivr.net/gh/photonstorm/phaser3-examples@master/public/assets/sprites/tree.png');
        }

        function create() {
            // Fondo verde pasto estilo mapa táctico
            this.cameras.main.setBackgroundColor('#285227');

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // Plaza central de piedra adoquinada para el castillo
            const plaza = this.add.graphics();
            plaza.fillStyle(0x1b361a, 0.7);
            plaza.fillRoundedRect(centerX - 120, centerY - 80, 240, 160, 16);

            // Árboles decorativos a los costados
            this.add.image(centerX - 130, centerY - 60, 'arbol').setScale(1.2);
            this.add.image(centerX + 140, centerY + 50, 'arbol').setScale(1.2);

            // Añadimos nuestro Castillo Pro perfectamente centrado
            const castillo = this.add.image(centerX, centerY - 10, 'castillo_pro');
            castillo.setScale(1.4);

            // Etiqueta del edificio
            this.add.text(centerX, centerY + 70, "🏰 Castillo Real", {
                font: "bold 15px sans-serif",
                fill: "#ffffff",
                backgroundColor: "rgba(15, 23, 42, 0.8)",
                padding: { x: 10, y: 5 }
            }).setOrigin(0.5);

            // Producción automática de madera cada 2 segundos
            this.time.addEvent({
                delay: 2000,
                callback: () => {
                    wood += 5;
                    document.getElementById('wood-count').innerText = wood;
                },
                loop: true
            });
        }

        function update() {
            // Lógica en tiempo real
        }
    </script>
</body>
</html>
