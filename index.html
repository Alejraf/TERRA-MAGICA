<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Terra Mágica - Simulador Medieval</title>
    <!-- Motor Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            overflow: hidden;
            font-family: sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        .ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 16px;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        🏰 <strong>Terra Mágica</strong><br>
        🪵 Madera: <span id="wood-count">100</span> | 🪙 Oro: <span id="gold-count">50</span>
    </div>

    <div id="game-container"></div>

    <script>
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            parent: 'game-container',
            pixelArt: true,
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        let wood = 100;
        let gold = 50;

        const game = new Phaser.Game(config);

        function preload() {
            // Generar una textura limpia de Castillo vectorial en tiempo real para evitar fallos de carga
            const graphics = this.make.graphics({x: 0, y: 0, add: false});
            
            // Paredes principales del castillo
            graphics.fillStyle(0x7f8c8d);
            graphics.fillRect(10, 20, 60, 50);
            
            // Torres laterales
            graphics.fillStyle(0x95a5a6);
            graphics.fillRect(0, 10, 20, 60);
            graphics.fillRect(60, 10, 20, 60);
            
            // Tejados
            graphics.fillStyle(0xc0392b);
            graphics.beginPath();
            graphics.moveTo(0, 10);
            graphics.lineTo(10, 0);
            graphics.lineTo(20, 10);
            graphics.fillPath();
            
            graphics.beginPath();
            graphics.moveTo(60, 10);
            graphics.lineTo(70, 0);
            graphics.lineTo(80, 10);
            graphics.fillPath();

            // Puerta principal
            graphics.fillStyle(0x5c4033);
            graphics.fillRect(30, 45, 20, 25);

            graphics.generateTexture('castillo_grafico', 80, 70);

            // Carga de árboles
            this.load.image('arbol', 'https://cdn.jsdelivr.net/gh/photonstorm/phaser3-examples@master/public/assets/sprites/tree.png');
        }

        function create() {
            // Fondo verde pasto
            this.cameras.main.setBackgroundColor('#347928');

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // Añadir el castillo generado perfectamente
            const castillo = this.add.image(centerX, centerY - 20, 'castillo_grafico');
            castillo.setScale(1.8);

            // Árboles decorativos alrededor
            this.add.image(centerX - 120, centerY - 80, 'arbol').setScale(1.2);
            this.add.image(centerX + 140, centerY + 90, 'arbol').setScale(1.2);

            // Etiqueta de la aldea
            this.add.text(centerX, centerY + 60, "Castillo Real", {
                font: "16px Arial",
                fill: "#ffffff",
                backgroundColor: "rgba(0,0,0,0.6)",
                padding: { x: 8, y: 4 }
            }).setOrigin(0.5);

            // Producción automática de madera
            this.time.addEvent({
                delay: 2000,
                callback: () => {
                    wood += 5;
                    document.getElementById('wood-count').innerText = wood;
                },
                loop: true
            });
        }

        function update() {
            // Bucle principal del juego
        }
    </script>
</body>
</html>
