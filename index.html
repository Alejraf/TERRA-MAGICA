<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Terra Mágica - Simulador Medieval</title>
    <!-- Motor Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            overflow: hidden;
            font-family: sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        .ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 16px;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        🏰 <strong>Terra Mágica</strong><br>
        🪵 Madera: <span id="wood-count">100</span> | 🪙 Oro: <span id="gold-count">50</span>
    </div>

    <div id="game-container"></div>

    <script>
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            parent: 'game-container',
            pixelArt: true,
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        let wood = 100;
        let gold = 50;

        const game = new Phaser.Game(config);

        function preload() {
            // Asset profesional de castillo medieval real con texturas detalladas
            this.load.image('castillo_real', 'https://labs.phaser.io/assets/sprites/castle.png');
            this.load.image('arbol', 'https://cdn.jsdelivr.net/gh/photonstorm/phaser3-examples@master/public/assets/sprites/tree.png');
        }

        function create() {
            // Fondo verde pasto
            this.cameras.main.setBackgroundColor('#2d572c');

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // Añadir árboles decorativos alrededor del castillo
            this.add.image(centerX - 130, centerY - 90, 'arbol').setScale(1.3);
            this.add.image(centerX + 150, centerY + 100, 'arbol').setScale(1.3);

            // Añadir el Castillo principal con diseño clásico y realista
            const castillo = this.add.image(centerX, centerY - 10, 'castillo_real');
            castillo.setScale(1.6);

            // Etiqueta del edificio
            this.add.text(centerX, centerY + 75, "Castillo Central", {
                font: "15px Arial",
                fill: "#ffffff",
                backgroundColor: "rgba(0,0,0,0.7)",
                padding: { x: 8, y: 4 }
            }).setOrigin(0.5);

            // Producción automática de madera
            this.time.addEvent({
                delay: 2000,
                callback: () => {
                    wood += 5;
                    document.getElementById('wood-count').innerText = wood;
                },
                loop: true
            });
        }

        function update() {
            // Bucle principal
        }
    </script>
</body>
</html>
