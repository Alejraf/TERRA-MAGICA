<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Terra Mágica - Simulador Medieval</title>
    <!-- Motor Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e293b;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        .ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #f1c40f;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #b45309;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 16px;
            pointer-events: none;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .ui-left strong {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <div class="ui-left">
            🏰 <strong>Terra Mágica</strong>
        </div>
        <div class="ui-right">
            🪵 Madera: <span id="wood-count" style="color:#22c55e;">100</span> | 🪙 Oro: <span id="gold-count" style="color:#eab308;">50</span>
        </div>
    </div>

    <div id="game-container"></div>

    <script>
        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            parent: 'game-container',
            pixelArt: true,
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        let wood = 100;
        let gold = 50;

        const game = new Phaser.Game(config);

        function preload() {
            // Sprites reales de alta calidad visual para entorno medieval
            this.load.image('fortaleza', 'https://labs.phaser.io/assets/sprites/medieval-cassle.png');
            this.load.image('arbol', 'https://cdn.jsdelivr.net/gh/photonstorm/phaser3-examples@master/public/assets/sprites/tree.png');
            this.load.image('roca', 'https://cdn.jsdelivr.net/gh/photonstorm/phaser3-examples@master/public/assets/sprites/stone.png');
        }

        function create() {
            // Fondo de mapa táctico medieval
            this.cameras.main.setBackgroundColor('#2d5a27');

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            // Base de piedra para el castillo principal
            const baseCastillo = this.add.graphics();
            baseCastillo.fillStyle(0x3e2723, 0.6);
            baseCastillo.fillRoundedRect(centerX - 130, centerY - 90, 260, 180, 12);
            baseCastillo.lineStyle(3, 0x5d4037, 1);
            baseCastillo.strokeRoundedRect(centerX - 130, centerY - 90, 260, 180, 12);

            // Entorno de bosque y recursos alrededor
            this.add.image(centerX - 150, centerY - 80, 'arbol').setScale(1.4);
            this.add.image(centerX + 160, centerY - 60, 'arbol').setScale(1.3);
            this.add.image(centerX - 140, centerY + 80, 'roca').setScale(1.2);
            this.add.image(centerX + 150, centerY + 90, 'arbol').setScale(1.3);

            // Fortaleza / Castillo principal con asset detallado y realista
            const castillo = this.add.image(centerX, centerY - 15, 'fortaleza');
            castillo.setScale(1.8);

            // Letrero elegante del edificio
            this.add.text(centerX, centerY + 75, "🏰 Bastión Real", {
                font: "bold 15px sans-serif",
                fill: "#ffffff",
                backgroundColor: "rgba(15, 23, 42, 0.85)",
                padding: { x: 10, y: 5 }
            }).setOrigin(0.5);

            // Sistema automático de producción de recursos
            this.time.addEvent({
                delay: 2000,
                callback: () => {
                    wood += 5;
                    document.getElementById('wood-count').innerText = wood;
                },
                loop: true
            });
        }

        function update() {
            // Lógica de juego en tiempo real
        }
    </script>
</body>
</html>
